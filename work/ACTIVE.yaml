notes:
  - Owner accepted SK-04C on 2026-09-25 after proposal CLOSURE gate #299 passed.
  - one SketchInteractionState is the sole semantic interaction authority for active Sketch edit.
  - Part context switches Editor Tools and Operations to Sketch context on edit entry and restores Part context on exit/fail-closed loss.
  - Sketch Select/Line tools live above the Viewport; contextual Operations remain in the right panel; compact Command Line lives below the Viewport; global Status remains separate.
  - rectangle selection replaces semantic selection and assigns no primary in R4.
  - Ctrl point-selection modifier is sampled on release; Ctrl-additive rectangle selection remains R5.
  - Command Line accepts SELECT and LINE only; recognized submission returns focus to Viewport; text-focus Esc/Delete do not invoke Sketch tool actions.
  - RMB command grammar remains out of scope.
  - R4 completes only after SK-04C implementation, documentation and exact-head verification succeed.
