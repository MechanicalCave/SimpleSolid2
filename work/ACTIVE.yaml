notes:
  - PERSIST-01 accepted and implemented on 2026-09-24.
  - Native top-level Documents use one portable ZIP-compatible package.
  - Container v1 requires manifest.json and authored/document.json; derived/* is optional and disposable.
  - The common manifest owns recognition/version/kind/DocumentId dispatch only; Part owns Part-authored payload semantics.
  - Part domain schema is v1 in the accepted native representation.
  - Future Part-hosted Sketch authored state persists through Part ownership; Sketch Core does not own a standalone file.
  - miniz 3.1.2 and nlohmann/json 3.12.0 are vendored and pinned; normal builds do not fetch them.
  - The experimental line-based SS2PART v1/v2 format is intentionally unsupported and has no migration requirement.
  - Container parsing is bounded and fail-closed for unsafe/duplicate entries, unsupported versions/features and malformed mandatory content.
  - Existing Project/Document identity, discovery, atomic Save and canonical DocumentSession behavior remain intact.
  - The compiled CTest suite contains 33 tests, including persist01.native_document_container.
  - Assembly/Drawing semantic schemas, Sketch implementation, tile/icon browsing and thumbnail generation remain out of scope.
  - Root .\ss2.ps1 docs and Windows exact-head verification remain mandatory.
