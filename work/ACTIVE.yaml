  - Selection grammar is additive ordinary LMB/Window/Crossing, Ctrl toggle, blank/Esc clear in Select, semantic primary, hover/preselection, grips on all selected editable entities and exactly one active grip.
  - Direct manipulation freezes a selection snapshot; entity-specific Reshape affects the handle owner, while common transforms affect the selection snapshot.
  - Grip-started manipulation uses the active grip as pivot/base and has no in-session Base Point replacement.
  - LMB or Enter commits; Esc cancels transient manipulation while preserving selection; a subsequent Esc in Select clears selection.
  - Edit preserves EntityId; semantic Copy creates fresh EntityIds.
  - Multi-object commits are atomic all-or-nothing operations with one Undo entry per accepted commit.
  - Undo/Redo remain global history boundaries and cancel active transient manipulation first.
  - Creation tools preserve pre-existing selection while hiding/deactivating grips; newly created geometry is not automatically selected.
  - Circle canonical geometry is center+radius; Arc canonical geometry is center+radius+startAngle+signedSweepAngle.
  - Initial Circle creation is Center+Radius; initial Arc creation is 3-Point.
  - Rectangle is a future creation tool producing four ordinary Lines; Polyline durable semantics remain deferred.
  - Creation and editing share one Input Resolution layer.
  - Historical roadmap-v1.2 input-resolution note: numeric locks outrank lower-priority runtime assistance. Roadmap v1.7 now expresses the R10 directional layer as Polar/inference rather than separate Ortho/Polar modes.
  - Historical roadmap-v1.2 Ortho/Polar mutual-exclusion direction is superseded by Roadmap v1.7 for R10: Polar is the sole directional magnet; orthogonal-only attraction is Polar 360/4.
  - OSNAP is a configurable user mode set with one-shot temporary overrides; candidate resolution is deterministic with no manual candidate cycling.
  - Object Snap Tracking acquires one or more temporary points by hover/dwell and clears them on point acceptance or Esc.
  - Grid and Grid Snap are independent.
  - Dynamic Input and Command Line feed one semantic request; Tab may lock/cycle fields.
  - Numeric parsing is planned to accept explicit units, comma or dot decimals, and semicolon-separated Cartesian components.
  - Construction is a durable semantic role excluded from material regions by default but available to selection/snap/measure/inference/future constraints.
  - Measure remains read-only runtime diagnostics; standalone Show Dimensions is deferred by Roadmap v1.6 so future viewport dimensions can be designed with authored/parametric dimension and constraint architecture.

