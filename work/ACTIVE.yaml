notes:
  - PERSIST-01 accepted by Owner on 2026-09-24.
  - Native top-level Documents are one portable ZIP-compatible package.
  - Container v1 requires manifest.json and authored/document.json; derived/* is optional and disposable.
  - Part owns Part-authored payload semantics; future Part-hosted Sketch data is persisted through Part ownership.
  - The experimental SS2PART v1/v2 format has no compatibility/migration requirement.
  - Assembly and Drawing semantic schemas remain out of scope.
  - Tile/icon browser and thumbnail generation remain out of scope.
  - No production Sketch Core, Body/Feature, modeled B-Rep, Assembly or Drawing implementation is authorized by PERSIST-01.
  - Documentation impact is required before completion.
  - Root .\ss2.ps1 docs and Windows exact-head verification remain mandatory.
