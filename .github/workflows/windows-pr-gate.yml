name: Windows PR gate (self-hosted)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "ss2.ps1"
      - "ss2.cmd"
      - ".github/workflows/windows-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 45

    defaults:
      run:
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "[runner] machine: $COMPUTERNAME"
          echo "[runner] workspace: $GITHUB_WORKSPACE"
          echo "[runner] expected SHA: $expected"
          echo "[runner] checkout SHA: $actual"
          test "$actual" = "$expected"

      - name: Configure SS2 machine-local environment
        run: |
          "/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe" \
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "./ss2.ps1" setup \
            -QtRoot "D:/Qt" \
            -OcctRoot "D:/SimpleSolid2/.simplesolid-env"

      - name: Bootstrap verification
        run: |
          "/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe" \
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "./ss2.ps1" verify

      - name: Build
        run: |
          "/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe" \
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "./ss2.ps1" build

      - name: Test
        run: |
          "/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe" \
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "./ss2.ps1" test
