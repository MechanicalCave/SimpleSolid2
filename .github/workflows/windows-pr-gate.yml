name: Windows PR gate (self-hosted)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/**"
      - "docs/**"
      - "work/**"
      - "governance/**"
      - "AGENTS.md"
      - "README.md"
      - "tests/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "ss2.ps1"
      - "ss2.cmd"
      - ".github/workflows/windows-pr-gate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      trusted_full_sha: ${{ steps.classify.outputs.trusted_full_sha }}
      diff_start_sha: ${{ steps.classify.outputs.diff_start_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate revision with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "[gate] expected SHA: $expected"
          echo "[gate] checkout SHA: $actual"
          test "$actual" = "$expected"

      - name: Classifier self-test
        shell: pwsh
        run: ./scripts/ci/ss2-pr-gate-classifier.ps1 -SelfTest

      - name: Resolve verification tier
        id: classify
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GATE_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          ./scripts/ci/ss2-pr-gate-classifier.ps1 `
            -Repository "${{ github.repository }}" `
            -WorkflowFile "windows-pr-gate.yml" `
            -EventName $env:GATE_EVENT_NAME `
            -HeadSha $env:GATE_HEAD_SHA `
            -BaseSha $env:GATE_BASE_SHA `
            -PullRequestDraft $env:GATE_PR_DRAFT `
            -GitHubToken $env:GITHUB_TOKEN `
            -OutputPath $env:GITHUB_OUTPUT

  fast:
    name: windows-msvc-fast
    needs: classify
    if: needs.classify.outputs.mode == 'fast'
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -Command "& ([scriptblock]::Create((Get-Content -Raw -LiteralPath '{0}')))"
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ needs.classify.outputs.head_sha }}"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "[runner] machine: $env:COMPUTERNAME"
          Write-Host "[runner] workspace: $env:GITHUB_WORKSPACE"
          Write-Host "[runner] expected SHA: $expected"
          Write-Host "[runner] checkout SHA: $actual"
          if ($actual -ne $expected) {
              throw "Runner checkout SHA mismatch: expected $expected, got $actual"
          }

      - name: Configure SS2 machine-local environment
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 setup -QtRoot "D:\Qt" -OcctRoot "D:\SimpleSolid2\.simplesolid-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap verification
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: FAST test
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 test -Tier fast -NoBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: windows-msvc-full
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 45
    defaults:
      run:
        shell: >-
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -Command "& ([scriptblock]::Create((Get-Content -Raw -LiteralPath '{0}')))"
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ needs.classify.outputs.head_sha }}"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "[runner] machine: $env:COMPUTERNAME"
          Write-Host "[runner] workspace: $env:GITHUB_WORKSPACE"
          Write-Host "[runner] expected SHA: $expected"
          Write-Host "[runner] checkout SHA: $actual"
          if ($actual -ne $expected) {
              throw "Runner checkout SHA mismatch: expected $expected, got $actual"
          }

      - name: Verify documentation dispatcher
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/browser/index.html
          if ($LASTEXITCODE -ne 0) {
              throw "Documentation Browser changed after '.\ss2.ps1 docs'. Commit the regenerated Browser."
          }

      - name: Configure SS2 machine-local environment
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 setup -QtRoot "D:\Qt" -OcctRoot "D:\SimpleSolid2\.simplesolid-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap verification
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test tier dispatcher self-test
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 test -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify FAST and SUBSYSTEM selectors
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 test -Tier fast -NoBuild -ListOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ss2.ps1 test -Tier subsystem -Subsystem "sketch,viewer,ui" -NoBuild -ListOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 test -Tier full -NoBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs:
    name: windows-docs
    needs: classify
    if: needs.classify.outputs.mode == 'docs'
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 10
    defaults:
      run:
        shell: >-
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -Command "& ([scriptblock]::Create((Get-Content -Raw -LiteralPath '{0}')))"
    steps:
      - name: Checkout exact documentation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          $expected = "${{ needs.classify.outputs.head_sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Checkout SHA mismatch: expected $expected, got $actual" }

      - name: Regenerate and verify documentation
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/browser/index.html
          if ($LASTEXITCODE -ne 0) {
              throw "Documentation Browser is stale."
          }
          .\scripts\ss2-docs.ps1 -Check -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  closure:
    name: windows-closure
    needs: classify
    if: needs.classify.outputs.mode == 'closure'
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 5
    defaults:
      run:
        shell: >-
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
          -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -Command "& ([scriptblock]::Create((Get-Content -Raw -LiteralPath '{0}')))"
    steps:
      - name: Checkout exact closure revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          $expected = "${{ needs.classify.outputs.head_sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Checkout SHA mismatch: expected $expected, got $actual" }

      - name: Verify governance and documentation invariants
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\ss2-docs.ps1 -Check -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  gate:
    name: windows-msvc
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - classify
      - fast
      - full
      - docs
      - closure
    runs-on: ubuntu-latest
    steps:
      - name: Require selected verification tier
        shell: bash
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CLOSURE_RESULT: ${{ needs.closure.result }}
          TRUSTED_FULL_SHA: ${{ needs.classify.outputs.trusted_full_sha }}
        run: |
          set -euo pipefail
          echo "[gate] mode=$MODE"
          echo "[gate] trusted_full_sha=$TRUSTED_FULL_SHA"
          echo "[gate] classify=$CLASSIFY_RESULT fast=$FAST_RESULT full=$FULL_RESULT docs=$DOCS_RESULT closure=$CLOSURE_RESULT"
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Classifier did not succeed." >&2
            exit 1
          fi
          case "$MODE" in
            fast) selected="$FAST_RESULT" ;;
            full) selected="$FULL_RESULT" ;;
            docs) selected="$DOCS_RESULT" ;;
            closure) selected="$CLOSURE_RESULT" ;;
            *) echo "Unknown gate mode: $MODE" >&2; exit 1 ;;
          esac
          if [[ "$selected" != "success" ]]; then
            echo "Selected $MODE tier did not succeed: $selected" >&2
            exit 1
          fi
          echo "[gate] selected $MODE tier succeeded"
