name: Windows PR gate (self-hosted)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "ss2.ps1"
      - "ss2.cmd"
      - ".github/workflows/windows-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - windows
      - x64
      - simplesolid2-native
    timeout-minutes: 45

    defaults:
      run:
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "[runner] machine: $env:COMPUTERNAME"
          Write-Host "[runner] workspace: $env:GITHUB_WORKSPACE"
          Write-Host "[runner] expected SHA: $expected"
          Write-Host "[runner] checkout SHA: $actual"
          if ($actual -ne $expected) {
              throw "Runner checkout SHA mismatch: expected $expected, got $actual"
          }

      - name: Configure SS2 machine-local environment
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 setup -QtRoot "D:\Qt" -OcctRoot "D:\SimpleSolid2\.simplesolid-env"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap verification
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: |
          $ErrorActionPreference = "Stop"
          .\ss2.ps1 test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
